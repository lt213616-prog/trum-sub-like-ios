name: Publish iPhone install page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get iOS-only source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read actual GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and validate iPhone files
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 ios_profile/export_github_pages.py --site-url "$SITE_URL" --output _site
          node ios_profile/test_splash.mjs _site/launch.html
      - name: Upload only public website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
